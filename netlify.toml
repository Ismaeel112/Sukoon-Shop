[build]
  command = "npx --yes pnpm@10.18.0 install --frozen-lockfile && npx --yes pnpm@10.18.0 run build:static"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.18.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = []

[[redirects]]
  from = "/api/shopify/catalog"
  to = "/.netlify/functions/shopify-catalog"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
